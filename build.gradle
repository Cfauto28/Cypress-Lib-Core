buildscript {
    repositories {
        mavenCentral()
        flatDir {
            dirs 'libs2'
        }
    }
    dependencies {
        classpath files('libs2/ploceus-1.17.local.jar')
	//classpath files('libs2/fabric-loom-1.17.local.jar')
        classpath files('libs2/signature-changer-1.0.0.jar')
	classpath files('libs2/mapping-utils-0.19.2.jar')
	classpath files('libs2/nester-1.4.0.jar')
	classpath files('libs2/exceptor-1.1.0.jar')
	classpath files('libs2/preen-1.1.0.jar')
	classpath files('libs2/condor-1.4.5.jar')
	classpath 'com.vdurmont:semver4j:3.1.0'
    }
}

plugins {
	id 'maven-publish'
	id 'fabric-loom' version '1.17.17'
	//id 'ploceus' version '1.17.local'
}

apply plugin: 'ploceus'

base {
	archivesName = project.archives_base_name
}
version = "${project.version}+mc${project.minecraft_version}"
group = project.maven_group

repositories {
	//maven {
	//	url = uri("${project.projectDir}/repo")
	//}
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	//getCustomMinecraftMetadata().set("http://127.0.0.1:5500/minecraft-info.json")
	//getIntermediaryUrl().set("net.ornithemc:calamus-intermediary-gen2:a1.0.16.05_20")

	clientOnlyMinecraftJar()
	//noIntermediateMappings()
	accessWidenerPath = file("src/main/resources/cypress_lib_core.classtweaker")

}

ploceus {
	setIntermediaryGeneration(2)
	disableLibraryUpgrades()
	//ploceus.dependOsl('0.16.3', 'client')
	//disableLvtPatch()
}

dependencies {

	implementation 'org.apache.logging.log4j:log4j-api:2.23.1'
	implementation 'org.apache.logging.log4j:log4j-core:2.23.1'

/*	implementation files('libs2/ornithe-standard-libraries-0.20.3/osl-blocks-0.1.1+mca1.0.1_01-mc1.6.4.jar')
	implementation files('libs2/ornithe-standard-libraries-0.20.3/osl-branding-0.4.3+mca1.0.1_01-mca1.2.1_01.jar')
	implementation files('libs2/ornithe-standard-libraries-0.20.3/osl-config-0.6.2+mcb1.3-mcb1.7.3.jar')
	implementation files('libs2/ornithe-standard-libraries-0.20.3/osl-core-0.9.0+mca1.0.1_01-mc14w26c.jar')
	implementation files('libs2/ornithe-standard-libraries-0.20.3/osl-entrypoints-0.6.1+mca1.0.1_01-mc1.5.2.jar')
	implementation files('libs2/ornithe-standard-libraries-0.20.3/osl-executors-0.1.0+mcin-20100128-2304-mcb1.9-pre2.jar')
	implementation files('libs2/ornithe-standard-libraries-0.20.3/osl-items-0.1.0+mca1.0.1_01-mc1.6.4.jar')
	implementation files('libs2/ornithe-standard-libraries-0.20.3/osl-keybinds-0.3.0+mca1.0.1_01-mcb1.7.3.jar')
	implementation files('libs2/ornithe-standard-libraries-0.20.3/osl-lifecycle-events-0.6.1+mca1.0.1_01-mca1.2.6.jar')
	implementation files('libs2/ornithe-standard-libraries-0.20.3/osl-localization-0.1.0+mca1.0.1_01-mca1.2.6.jar')
	implementation files('libs2/ornithe-standard-libraries-0.20.3/osl-networking-0.9.0+mca1.0.16-mca1.2.6.jar')
	implementation files('libs2/ornithe-standard-libraries-0.20.3/osl-networking-impl-0.1.1+mca1.0.16-mca1.2.6.jar')
	implementation files('libs2/ornithe-standard-libraries-0.20.3/osl-resource-loader-0.7.4+mca1.0.1_01-mca1.2.1_01.jar')
	implementation files('libs2/ornithe-standard-libraries-0.20.3/osl-text-components-0.1.0-alpha.3+mca0.1.0-mc1.14.4.jar') */

	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	exceptions ploceus.raven(project.raven_build)
	signatures ploceus.sparrow(project.sparrow_build)
	nests ploceus.nests(project.nests_build)
	/*mappings ploceus.featherMappings(project.feather_build)*/

	mappings ("net.ornithemc:feather-gen2:a1.0.16.05_20+build.1-v2")

	//ploceus.dependOsl(project.osl_version)
}

processResources {
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 8
}

java {
	// Still required by IDEs such as Eclipse and Visual Studio Code
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8

	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	// If this mod is going to be a library, then it should also generate Javadocs in order to aid with development.
	// Uncomment this line to generate them.
	// withJavadocJar()
}

// If you plan to use a different file for the license, don't forget to change the file name here!
jar {
	from('LICENSE') {
		rename { "${it}_${base.archivesName.get()}" }
	}
}

// Configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
